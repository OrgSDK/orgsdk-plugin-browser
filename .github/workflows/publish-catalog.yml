name: Publish to Catalog

# Delegates to the centrally maintained reusable catalog-publish workflow in
# OrgSDK/plugins. That workflow builds + validates via THIS repo's npm scripts,
# then publishes with the orgsdk-plugin CLI (dry-run by default; a real publish
# requires the opt-in variable AND the token secret).
#
# browser does NOT opt in by default — there is no ORGSDK_ENABLE_CATALOG_PUBLISH
# variable set on this repository yet. Pushes to main build + validate the
# artifact but never POST. Phase 3 (catalog publication) is deferred until
# platform-side verification of the dependency-archive fallback path completes.
# See https://github.com/OrgSDK/plugins/blob/main/docs/reusable-workflows.md

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "package.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (do not POST to catalog)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  publish:
    # Auto path: only when the opt-in variable is 'true'. Until browser opts
    # in, this job is skipped at the job level — no secrets are accessed.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.ORGSDK_ENABLE_CATALOG_PUBLISH == 'true')
    uses: OrgSDK/plugins/.github/workflows/plugin-publish.yml@c5296ffdc31e567a0ae3dd32a25594702995d839
    with:
      # push → real publish (when opted in); manual → honor the dry_run choice.
      dry-run: ${{ !(github.event_name == 'push' || github.event.inputs.dry_run == 'false') }}
      publish-enabled: ${{ vars.ORGSDK_ENABLE_CATALOG_PUBLISH }}
      catalog-url: ${{ vars.ORGSDK_CATALOG_URL }}
      artifact-name: plugin-browser-${{ github.sha }}
    secrets:
      ORGSDK_PUBLISH_TOKEN: ${{ secrets.ORGSDK_PUBLISH_TOKEN }}
