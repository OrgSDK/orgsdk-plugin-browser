name: CI

# Delegates to the centrally maintained reusable CI workflow in OrgSDK/plugins.
# That workflow runs in THIS repo's context (caller checkout, caller
# GITHUB_TOKEN) and only invokes the npm scripts below + the orgsdk-plugin CLI.
# See https://github.com/OrgSDK/plugins/blob/main/docs/reusable-workflows.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Mocked-tests gate. Runs on every push/PR. The browser binary is NOT
    # installed — tests run against a mock ChromiumLauncher that asserts every
    # hardening control (CSP injection, route interception, size ceilings,
    # mutex, cleanup, sanitized errors). Fast and deterministic.
    uses: OrgSDK/plugins/.github/workflows/plugin-ci.yml@4eb6706b38a8b1ccbad8b68bfbe9924e3167ef1f
    with:
      artifact-name: plugin-browser-${{ github.sha }}

  integration:
    # Real-Chromium integration gate. Disabled by default — opt in via the
    # RUN_BROWSER_INTEGRATION repo variable (set to "true") or via
    # workflow_dispatch. The plugin's hardening model is the contract under
    # test: a real headless Chromium render of a data:-only HTML document must
    # succeed (every incidental external request is intercepted+aborted by the
    # route handler, so no network trap is hit). Produces no publishable
    # artifact — pure runtime verification of the daemon-image execution path.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.RUN_BROWSER_INTEGRATION == 'true')
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      BROWSER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium (Playwright 1.60.0 driver-matched build)
        run: bunx playwright install --with-deps chromium
      - name: typecheck
        run: bun run typecheck
      - name: "Real-Chromium integration (data: URLs only, no network egress)"
        run: bun run test:integration
